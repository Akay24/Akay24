<svg
  width="495"
  height="565"
  viewBox="0 0 495 565"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="WakaTime Stats"
>
  <title id="titleId">WakaTime Stats</title>
  <style>
    .header {
      font: 700 18px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Sans-Serif;
      fill: #9745f5;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .total-time {
      font: 600 12px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Sans-Serif;
      fill: #8b949e;
    }
    .lang-name {
      font: 400 11px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Sans-Serif;
      fill: #ffffff;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    @keyframes slideInAnimation {
      from { width: 0; }
      to { width: 445px; }
    }
  </style>

  <!-- Background (pitch black matching midnight-purple theme) -->
  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="6"
    height="564"
    width="494"
    fill="#000000"
    stroke="#000000"
  />

  <!-- Card Title & Total Time -->
  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header" data-testid="header">WakaTime Stats</text>
    <text x="445" y="0" text-anchor="end" class="total-time">252 hrs 6 mins</text>
  </g>

  <!-- Main Card Body -->
