name: WakaTime Realtime Sync

on:
  schedule:
    # Runs every 4 hours to keep stats fresh
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_wakatime.py'
      - '.github/workflows/wakatime.yml'

permissions:
  contents: write

jobs:
  sync-wakatime:
    name: Sync WakaTime Stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check WakaTime Secret
        id: check_secret
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [ -z "$WAKATIME_API_KEY" ]; then
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "::warning title=Missing Secret::WAKATIME_API_KEY is not set in GitHub repository secrets. Add it under Settings > Secrets and variables > Actions to enable real-time sync."
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate WakaTime SVG
        if: steps.check_secret.outputs.has_secret == 'true'
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_RANGE: all_time
          CARD_TITLE: WakaTime Stats
          BG_COLOR: '#000000'
          OUTPUT_PATH: assets/wakatime.svg
        run: |
          python3 scripts/generate_wakatime.py

      - name: Commit & Push Changes
        if: steps.check_secret.outputs.has_secret == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/wakatime.svg
          if git diff --staged --quiet; then
            echo "No changes to WakaTime stats."
          else
            git commit -m "telemetry: sync realtime wakatime stats [skip ci]"
            git push
          fi
